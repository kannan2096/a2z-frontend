server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router handles the route client-side, nginx just
    # needs to always hand back index.html instead of 404ing on /catalogue etc.
    location / {
        try_files $uri /index.html;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
